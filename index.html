function filtered(){return records.filter(r=>{

function cardMarkup(r){const d=domainOf(r.domain);return `<article class="knowledge-card" data-open="${esc(r.id)}" tabindex="0" role="button" aria-label="باز کردن ${esc(r.title)}"><div class="card-cover" style="--cover:${d.cover};--coverink:${d.coverink}">${icon(r.type==='code'?'code':r.type==='link'?'link':r.type==='task'?'checksquare':d.icon)}<span class="cover-lines"><i></i><i></i><i></i></span><span class="cover-format">${esc(r.language||({document:'DOCUMENT',task:'CHECKLIST',link:'BOOKMARK',idea:'IDEA',note:'NOTE'}[r.type]||'NOTE'))}</span></div><div class="card-content">${selectionCheckbox(r)}<span class="pill">${esc(d.name)}</span><h3>${esc(r.title)}</h3><p>${esc(r.note)}</p><footer><span>${dateFa(r.date)}${r.sample?' · نمونه':''}</span><div class="row-actions">${rowActions(r)}</div></footer></div></article>`;}

function normalizeProductionRecord(r){
 if(!r||typeof r!=='object')return null;
 const legacy=!r.domain;
 return {...r,id:String(r.id||uid()),title:String(r.title||'بدون عنوان'),domain:domains.some(d=>d.id===r.domain)?r.domain:domains[0].id,folder:String(r.folder||(legacy?'اندروید / ':'')+(r.category||'عمومی')),project:String(r.project||''),category:String(r.category||''),type:typeNames[r.type]?r.type:'note',date:/^\d{4}-\d{2}-\d{2}$/.test(String(r.date))?r.date:today(),note:String(r.note||''),code:String(r.code||''),language:String(r.language||''),tags:Array.isArray(r.tags)?r.tags.join(', '):String(r.tags||''),status:statuses[r.status]?r.status:'todo',star:!!r.star,deleted:!!r.deleted,image:typeof r.image==='string'?r.image:'',url:typeof r.url==='string'?r.url:'',sample:false,...(r.history?{history:normalizedHistory(r.history)}:{})};

function loadProductionState(){
 let meta=null,rawRecords=null;
 try{meta=JSON.parse(localStorage.getItem(metaKey)||'null');}catch{}
 profile=normalizeProfile(meta?.profile);preferences=normalizePreferences(meta?.preferences);archivedDomains=normalizeArchivedDomains(meta?.archivedDomains);
 domains=Array.isArray(meta?.domains)&&meta.domains.length?meta.domains.map(normalizeDomain):cloneState(domainDefaults);
 folders=Array.isArray(meta?.folders)?meta.folders.filter(f=>f&&typeof f.path==='string').map(f=>({...f,path:f.path,domain:domains.some(d=>d.id===f.domain)?f.domain:domains[0].id})):[];
 projects=Array.isArray(meta?.projects)?meta.projects.filter(p=>p&&typeof p.name==='string'):[];
 try{const raw=localStorage.getItem(key);if(raw!==null){rawRecords=JSON.parse(raw);if(!Array.isArray(rawRecords)||rawRecords.some(r=>!r||typeof r!=='object'))throw Error('format');}}catch{storageReadError=true;}
 records=(Array.isArray(rawRecords)?[...rawRecords,...cloneState(window.NOTEBOOK_SEED).filter(seed=>!rawRecords.some(r=>r&&r.id===seed.id))]:cloneState(window.NOTEBOOK_SEED)).map(normalizeProductionRecord).filter(Boolean);

function store(){
 if(storageReadError){toast('ذخیرهٔ قبلی قابل خواندن نیست؛ از راهنما خروجی بازیابی دریافت کنید.');return false;}
 let previousRecords=null,previousMeta=null,wroteRecords=false,wroteMeta=false;
 try{
   previousRecords=localStorage.getItem(key);previousMeta=localStorage.getItem(metaKey);
   const recordJSON=JSON.stringify(records),metaJSON=JSON.stringify({version:2,domains,folders,projects,profile,preferences,archivedDomains});
   localStorage.setItem(key,recordJSON);wroteRecords=true;
   localStorage.setItem(metaKey,metaJSON);wroteMeta=true;
   lastCommitted=cloneState(packState());return true;
 }catch{
   try{if(wroteRecords){if(previousRecords===null)localStorage.removeItem(key);else localStorage.setItem(key,previousRecords);}if(wroteMeta){if(previousMeta===null)localStorage.removeItem(metaKey);else localStorage.setItem(metaKey,previousMeta);}}catch{}
   restoreMemory(lastCommitted);toast('ذخیره انجام نشد؛ فضای مرورگر را بررسی کنید و پشتیبان بگیرید.');return false;
 }
}
function projectNames(){return [...new Set([...active().map(r=>r.project),...projects.map(p=>p.name)])].filter(Boolean).sort((a,b)=>a.localeCompare(b,'fa'));}
function folderEntries(){
 const entries=new Map();
 const add=(domain,path)=>{const pieces=String(path||'').split('/').map(p=>p.trim()).filter(Boolean);for(let i=1;i<=pieces.length;i++){const part=pieces.slice(0,i).join(' / ');entries.set(domain+'::'+part,{domain,path:part});}};
 active().forEach(r=>add(r.domain,r.folder));folders.forEach(f=>add(f.domain,f.path));
 return [...entries.values()].sort((a,b)=>a.path.localeCompare(b.path,'fa'));
}

function applyImport(){
 if(!pendingImport)return;
 const mode=document.querySelector('input[name="import-mode"]:checked').value;
 if(document.getElementById('backup-before-import').checked)exportBackup();
 const before=cloneState(packState()),incoming=pendingImport,restoreProfile=!!document.getElementById('import-profile')?.checked;
 try{

function archiveDomain(id,targetId){
 const domain=domains.find(d=>d.id===id);if(!domain||domains.length<2||id===targetId||!domains.some(d=>d.id===targetId))return false;
 const entry={id:uid(),domain:cloneState(domain),targetId,deletedAt:new Date().toISOString(),folders:cloneState(folders.filter(f=>f.domain===id))};
 records.forEach(r=>{if(r.domain===id){r.domain=targetId;r.domainTransfer=entry.id;}});
 folders.forEach(f=>{if(f.domain===id){f.domain=targetId;f.domainTransfer=entry.id;}});
 folders=[...new Map(folders.map(f=>[f.domain+'::'+f.path,f])).values()];
 domains=domains.filter(d=>d.id!==id);archivedDomains.unshift(entry);
 return store();
}
function restoreDomain(entryId){
 const entry=archivedDomains.find(x=>x.id===entryId);if(!entry||domains.some(d=>d.id===entry.domain.id))return false;
 domains.push(cloneState(entry.domain));
 records.forEach(r=>{if(r.domainTransfer===entryId&&r.domain===entry.targetId){r.domain=entry.domain.id;delete r.domainTransfer;}});
 folders.forEach(f=>{if(f.domainTransfer===entryId&&f.domain===entry.targetId){f.domain=entry.domain.id;delete f.domainTransfer;}});
 const known=new Set(folders.map(f=>f.domain+'::'+f.path));
 entry.folders.forEach(f=>{if(!known.has(entry.domain.id+'::'+f.path))folders.push({...f,domain:entry.domain.id});});
 archivedDomains=archivedDomains.filter(x=>x.id!==entryId);
 return store();
}
function permanentlyDeleteDomain(entryId){
 const entry=archivedDomains.find(x=>x.id===entryId);if(!entry)return false;
 const affected=records.filter(r=>r.domainTransfer===entryId&&r.domain===entry.targetId);
 const message='حوزهٔ «'+entry.domain.name+'» و '+fa(affected.length)+' یادداشت منتقل‌شده برای همیشه حذف می‌شوند. این کار قابل بازگشت نیست. ادامه می‌دهید؟';
 if(typeof window.confirm==='function'&&!window.confirm(message))return false;
 records=records.filter(r=>!(r.domainTransfer===entryId&&r.domain===entry.targetId));
 const paths=new Set(entry.folders.map(f=>f.path));
 folders=folders.filter(f=>{if(f.domainTransfer===entryId)return false;if(f.domain===entry.targetId&&paths.has(f.path))return records.some(r=>r.domain===entry.targetId&&r.folder===f.path||r.domain===entry.targetId&&String(r.folder).startsWith(f.path+' / '));return true;});
 archivedDomains=archivedDomains.filter(x=>x.id!==entryId);
 return store();
}
function compareNotes(a,b){switch(preferences.sort){case 'oldest':return noteTime(a)-noteTime(b);case 'title':return a.title.localeCompare(b.title,'fa');case 'domain':return domainOf(a.domain).name.localeCompare(domainOf(b.domain).name,'fa')||a.title.localeCompare(b.title,'fa');default:return noteTime(b)-noteTime(a);}}
function sortSelect(){return `<select id="sortFilter" aria-label="مرتب‌سازی یادداشت‌ها">${[['newest','تازه‌ترین ویرایش'],['oldest','قدیمی‌ترین'],['title','عنوان الفبایی'],['domain','بر اساس حوزه']].map(([value,label])=>`<option value="${value}" ${preferences.sort===value?'selected':''}>${label}</option>`).join('')}</select>`;}
function selectionCheckbox(r){return `<label class="select-note" data-selection-control><input type="checkbox" data-select-note="${esc(r.id)}" aria-label="انتخاب ${esc(r.title)}" ${selectedIds.has(r.id)?'checked':''}><span>انتخاب</span></label>`;}
function selectedNotes(){const visible=new Set(filtered().map(r=>r.id));return records.filter(r=>selectedIds.has(r.id)&&visible.has(r.id));}
function bulkToolbar(){const count=selectedNotes().length;return `<div class="bulk-toolbar"><button class="textbtn" data-action="select-results">${icon('checksquare','sm')}انتخاب همهٔ نتایج (${fa(filtered().length)})</button>${count?`<strong>${fa(count)} مورد انتخاب شده</strong>${activeSection==='trash'?'<button class="btn small" data-action="bulk-restore">بازیابی منتخب‌ها</button>':`<button class="btn small" data-action="bulk-move">${icon('folder','sm')}انتقال گروهی</button><button class="btn small" data-action="bulk-status">تغییر وضعیت</button><button class="btn small" data-action="bulk-star">نشان کردن</button><button class="btn small danger-btn" data-action="bulk-delete">${icon('trash','sm')}حذف منتخب‌ها</button>`}<button class="textbtn" data-action="clear-selection">لغو انتخاب</button>`:''}</div>`;}
function updateBulkToolbar(){const toolbar=document.getElementById('bulk-toolbar-container');if(toolbar)toolbar.innerHTML=bulkToolbar();}
function openBulkAction(kind){const list=selectedNotes();if(!list.length)return;const count=fa(list.length);let fields='';
 if(kind==='move')fields=`<label class="field">حوزهٔ مقصد<select name="domain">${domains.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('')}</select></label><label class="field">مسیر پوشهٔ مقصد (اختیاری)<input name="folder" placeholder="خالی بگذارید تا مسیر فعلی حفظ شود"></label>`;
 if(kind==='status')fields=`<label class="field">وضعیت جدید<select name="status">${Object.entries(statuses).map(([id,name])=>`<option value="${id}">${name}</option>`).join('')}</select></label>`;
 openModal(`${modalHead(kind==='delete'?'حذف گروهی یادداشت‌ها':kind==='move'?'انتقال گروهی یادداشت‌ها':'تغییر وضعیت گروهی')}<form id="bulk-action-form"><input type="hidden" name="kind" value="${kind}"><p class="action-summary">${count} یادداشت انتخاب شده است.${kind==='delete'?' موارد به سطل بازیافت می‌روند و قابل بازگردانی هستند.':''}</p>${fields}<div class="dialog-actions"><button class="btn" type="button" data-action="close">انصراف</button><button class="btn ${kind==='delete'?'danger-btn':'primary'}" type="submit">اعمال روی ${count} مورد</button></div></form>`,true);
}
function applyBulk(kind,values={}){
 const list=selectedNotes();if(!list.length)return false;
 if(kind==='move'&&!domains.some(d=>d.id===values.domain))return false;
 if(kind==='status'&&!statuses[values.status])return false;
 if(!['move','status','star','delete','restore'].includes(kind))return false;
 list.forEach(r=>{
  if(kind==='move'){r.history=historyWithSnapshot(r,'انتقال گروهی');r.domain=values.domain;delete r.domainTransfer;if(values.folder?.trim())r.folder=canonicalFolder(values.folder);}
  if(kind==='status'){r.history=historyWithSnapshot(r,'تغییر وضعیت گروهی');r.status=values.status;}
  if(kind==='star')r.star=true;
  if(kind==='delete')r.deleted=true;
  if(kind==='restore')r.deleted=false;
  if(kind==='move'||kind==='status')r.updatedAt=new Date().toISOString();
 });
 if(!store())return false;
 selectedIds.clear();return true;
}
function noteSnapshot(r){return Object.fromEntries(['title','note','code','tags','language','url','domain','folder','project','type','status','date'].map(key=>[key,String(r[key]??'')]));}
function normalizedHistory(value){return (Array.isArray(value)?value:[]).filter(v=>v&&typeof v.id==='string'&&v.snapshot&&typeof v.snapshot.title==='string').slice(-10).map(v=>({id:v.id,savedAt:String(v.savedAt||''),reason:String(v.reason||'ویرایش'),snapshot:noteSnapshot(v.snapshot)}));}
function historyWithSnapshot(r,reason='ویرایش یادداشت'){return [...normalizedHistory(r.history),{id:uid(),savedAt:new Date().toISOString(),reason,snapshot:noteSnapshot(r)}].slice(-10);}
function revisionDate(value){const date=new Date(value);return Number.isFinite(+date)?date.toLocaleString('fa-IR',{dateStyle:'short',timeStyle:'short'}):'نسخهٔ قبلی';}
function showHistory(id){const r=records.find(r=>r.id===id);if(!r)return;const history=normalizedHistory(r.history).reverse();openModal(`${modalHead('تاریخچهٔ '+esc(r.title))}<p class="profile-help">تا ۱۰ نسخهٔ قبلی متن، کد و مشخصات نگه‌داری می‌شود. هنگام بازیابی نسخه، تصویر پیوست فعلی حفظ می‌شود.</p><div class="revision-list">${history.map(v=>`<article><div><strong>${esc(v.snapshot.title)}</strong><small>${esc(revisionDate(v.savedAt))} · ${esc(v.reason)}</small><p>${esc(v.snapshot.note.slice(0,120)||v.snapshot.code.slice(0,120)||'بدون توضیحات')}</p></div><button class="btn small" data-action="preview-revision" data-id="${esc(id)}" data-revision="${esc(v.id)}">مشاهدهٔ نسخه</button></article>`).join('')||'<div class="empty">هنوز نسخهٔ قبلی وجود ندارد. از ویرایش بعدی، تاریخچه ذخیره می‌شود.</div>'}</div>`);}
function previewRevision(id,revisionId){const r=records.find(r=>r.id===id),v=normalizedHistory(r?.history).find(x=>x.id===revisionId);if(!v)return;openModal(`${modalHead('نسخهٔ قبلی: '+esc(v.snapshot.title))}<small class="muted">${esc(revisionDate(v.savedAt))}</small><div class="detail-body">${esc(v.snapshot.note)}</div>${v.snapshot.code?`<pre class="code-block">${esc(v.snapshot.code)}</pre>`:''}<div class="dialog-actions"><button class="btn" data-action="history" data-id="${esc(id)}">بازگشت به تاریخچه</button>${r.deleted?'':`<button class="btn primary" data-action="restore-revision" data-id="${esc(id)}" data-revision="${esc(revisionId)}">بازگردانی این نسخه</button>`}</div>`);}
function restoreRevision(id,revisionId){const r=records.find(r=>r.id===id),v=normalizedHistory(r?.history).find(x=>x.id===revisionId);if(!r||r.deleted||!v)return false;const history=historyWithSnapshot(r,'پیش از بازیابی نسخه'),domain=domains.some(d=>d.id===v.snapshot.domain)?v.snapshot.domain:r.domain,type=typeNames[v.snapshot.type]?v.snapshot.type:r.type,status=statuses[v.snapshot.status]?v.snapshot.status:r.status;Object.assign(r,v.snapshot,{domain,type,status,history,updatedAt:new Date().toISOString()});delete r.domainTransfer;return store();}
function duplicateNote(id){const r=records.find(r=>r.id===id);if(!r||r.deleted)return false;const copy={...cloneState(r),id:uid(),title:r.title+' (کپی)',date:today(),updatedAt:new Date().toISOString(),star:false,history:[]};delete copy.domainTransfer;records.unshift(copy);return store();}
const advancedActions=['delete-domain','restore-domain','permanent-delete-domain','select-results','clear-selection','bulk-move','bulk-status','bulk-star','bulk-delete','bulk-restore','history','preview-revision','restore-revision','duplicate-note'];
function advancedClick(action,data){
 switch(action){
 case 'delete-domain':return openDeleteDomain(data.id);
 case 'restore-domain':if(restoreDomain(data.id)){resetFilters();activeSection='folders';render();toast('حوزه بازیابی شد.');}return;
 case 'permanent-delete-domain':if(permanentlyDeleteDomain(data.id)){resetFilters();activeSection='folders';render();toast('حوزه و محتوای منتقل‌شده برای همیشه حذف شد.');}return;
 case 'select-results':filtered().forEach(r=>selectedIds.add(r.id));refreshRecords();return;
 case 'clear-selection':selectedIds.clear();refreshRecords();return;
 case 'bulk-move':return openBulkAction('move');
 case 'bulk-status':return openBulkAction('status');
 case 'bulk-delete':return openBulkAction('delete');
 case 'bulk-star':if(applyBulk('star')){render();toast('یادداشت‌های منتخب نشان شدند.');}return;
 case 'bulk-restore':if(applyBulk('restore')){render();toast('یادداشت‌های منتخب بازیابی شدند.');}return;
 case 'history':return showHistory(data.id);
 case 'preview-revision':return previewRevision(data.id,data.revision);
 case 'restore-revision':if(restoreRevision(data.id,data.revision)){closeModal();render();toast('نسخهٔ انتخاب‌شده بازیابی شد.');}return;
 case 'duplicate-note':if(duplicateNote(data.id)){resetFilters();activeSection='records';display='table';render();toast('یک کپی مستقل از یادداشت ساخته شد.');}return;
 }
}
document.addEventListener('submit',event=>{
 if(event.target.getAttribute('id')==='delete-domain-form'){event.preventDefault();const f=new FormData(event.target);if(archiveDomain(f.get('id'),f.get('target'))){closeModal();resetFilters();activeSection='folders';render();toast('حوزه کنار گذاشته شد؛ محتوا در حوزهٔ مقصد محفوظ است.');}}
 if(event.target.getAttribute('id')==='bulk-action-form'){event.preventDefault();const f=new FormData(event.target);if(applyBulk(f.get('kind'),{domain:f.get('domain'),folder:f.get('folder'),status:f.get('status')})){closeModal();render();toast('عملیات گروهی انجام شد.');}}
});
document.addEventListener('change',event=>{if(event.target.dataset.selectNote){if(event.target.checked)selectedIds.add(event.target.dataset.selectNote);else selectedIds.delete(event.target.dataset.selectNote);updateBulkToolbar();}if(event.target.id==='sortFilter'){preferences.sort=event.target.value;if(store())refreshRecords();}});
</script></body></html>
